<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

h1 span{color:#ffd21f}h2{color:#ffd21f;margin-top:32px}a{color:#ffd21f}nav{margin-top:40px;opacity:.8}</style></head><body><main><h1>fun_f<span>ai</span>cts</h1>
<h2>Login received</h2><p id="msg">Checking…</p>
<p><code id="code" style="word-break:break-all;background:#1d2d57;padding:8px 10px;border-radius:6px;display:none"></code></p>

<script>
const p=new URLSearchParams(location.search), c=p.get("code"), e=p.get("error_description")||p.get("error");
const m=document.getElementById("msg");
if(c){m.textContent="Copy this one-time code and use it within 5 minutes, as Claude explains.";
 const el=document.getElementById("code");el.textContent=c;el.style.display="inline-block";
 const b=document.getElementById("copy");b.style.display="inline-block";
 b.onclick=()=>{navigator.clipboard.writeText(c).then(()=>b.textContent="Copied")};}
else if(e){m.textContent="TikTok said: "+e;} else {m.textContent="No login code in this link.";}
</script></body></html>
